<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mailito</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f4faf7;--surf:#fff;--tx:#1f2933;--mut:#5f6b76;--line:#e1e6ea;--acc:#047857;--accbg:#d1fae5;--hover:#eef2f4;--unread:#fff;--read:#f2f6f7;--star:#f5a623;--danger:#c5362b}
@media (prefers-color-scheme:dark){:root{--bg:#14181b;--surf:#1c2226;--tx:#e6ebee;--mut:#9aa7b1;--line:#2e373d;--acc:#34d399;--accbg:#064e3b;--hover:#262f35;--unread:#1c2226;--read:#161b1e;--danger:#ff8a80}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.hide{display:none!important}
/* auth */
#auth{min-height:100%;display:grid;place-items:center;padding:20px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:32px;width:100%;max-width:380px}
.logo{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:600;color:var(--acc);letter-spacing:-.5px}
.logo svg{width:34px;height:34px}
.card p{color:var(--mut);margin:6px 0 20px}
.card input{width:100%;padding:12px;margin-bottom:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx)}
.btn{background:var(--acc);color:#fff;padding:11px 20px;border-radius:999px;font-weight:600}
@media (prefers-color-scheme:dark){.btn{color:#022c22}}
.card .btn{width:100%;border-radius:8px}
.link{color:var(--acc);margin-top:14px;display:block;text-align:center;width:100%}
.msg{color:var(--danger);min-height:18px;margin-bottom:8px;font-size:13px}.msg.ok{color:var(--acc)}
/* app */
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;padding:8px 16px;height:64px}
header .logo{width:200px;font-size:22px}
#q{flex:1;max-width:680px;padding:12px 18px;border:0;border-radius:999px;background:var(--hover);color:var(--tx)}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--mut)}
.av{width:34px;height:34px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:600}
@media (prefers-color-scheme:dark){.av{color:#022c22}}
.main{flex:1;display:flex;min-height:0}
nav{width:220px;padding:8px 8px 8px 12px;flex-shrink:0}
#compose{display:flex;align-items:center;gap:10px;background:var(--accbg);padding:16px 22px;border-radius:16px;font-weight:600;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
nav .f{display:flex;align-items:center;gap:14px;width:100%;padding:7px 14px;border-radius:0 999px 999px 0;margin-left:-12px;padding-left:26px;text-align:left}
nav .f:hover{background:var(--hover)}nav .f.on{background:var(--accbg);font-weight:700}
nav .f .n{margin-left:auto;font-size:12px}
nav .f svg{width:18px;height:18px;flex-shrink:0}
section{flex:1;background:var(--surf);border-radius:16px 16px 0 0;margin-right:16px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);color:var(--mut);min-height:48px}
.bar button{padding:6px 12px;border-radius:8px}.bar button:hover{background:var(--hover)}
.bar .t{font-weight:600;color:var(--tx);margin-right:auto}
#list{overflow:auto;flex:1}
#setup{background:var(--accbg);padding:14px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#setup input{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surf);color:var(--tx);width:170px}
#setup .at{font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:0 16px;height:44px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--read)}
.row.u{background:var(--unread);font-weight:700}
.row:hover{box-shadow:inset 0 -1px 0 var(--line),0 1px 4px rgba(0,0,0,.15);position:relative}
.row .s{width:24px;color:var(--mut);font-size:18px;line-height:1}.row .s.on{color:var(--star)}
.row .fr{width:180px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sb{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row .sb span{color:var(--mut);font-weight:400}
.row .d{font-size:12px;flex-shrink:0}
.empty{padding:60px 20px;text-align:center;color:var(--mut)}
#read{padding:24px 32px;overflow:auto;flex:1}
#read h2{font-size:22px;font-weight:500;margin:0 0 18px}
#read .meta{display:flex;align-items:center;gap:12px;margin-bottom:20px}
#read .meta small{color:var(--mut);display:block}
#read iframe{width:100%;height:62vh;border:1px solid var(--line);border-radius:8px;background:#fff}
#read .img{margin:0 0 10px;color:var(--mut)}
#read pre{font:inherit;white-space:pre-wrap;margin:0;max-width:75ch}
/* compose modal */
#cm{position:fixed;right:24px;bottom:0;width:520px;max-width:100%;background:var(--surf);border:1px solid var(--line);border-radius:12px 12px 0 0;box-shadow:0 8px 30px rgba(0,0,0,.3);display:flex;flex-direction:column;z-index:10}
#cm h3{margin:0;padding:10px 16px;background:var(--accbg);border-radius:12px 12px 0 0;font-size:14px;display:flex}
#cm h3 button{margin-left:auto;font-size:18px;line-height:1}
#cm input,#cm textarea{border:0;border-bottom:1px solid var(--line);padding:10px 16px;background:none;color:var(--tx);font:inherit;width:100%}
#cm textarea{height:280px;resize:none;border:0}
#cm .ft{display:flex;gap:10px;align-items:center;padding:10px 16px}
#toast{position:fixed;left:24px;bottom:24px;background:#263238;color:#fff;padding:12px 20px;border-radius:8px;z-index:20}
@media (max-width:760px){nav{width:64px;padding:8px}nav .f span,nav .n,#compose span{display:none}nav .f{padding-left:14px;margin:0;border-radius:999px}#compose{padding:14px;justify-content:center}header .logo b,.who span{display:none}header .logo{width:auto}.row .fr{width:100px}section{margin-right:0;border-radius:0}#cm{right:0}}
@media (prefers-reduced-motion:no-preference){#cm{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:0}}}
</style>
</head>
<body>

<div id="auth">
 <form class="card" id="af">
  <div class="logo"><svg viewBox="0 0 32 32"><rect x="2" y="6" width="28" height="20" rx="4" fill="currentColor"/><path d="M4 9l12 9 12-9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Mailito</div>
  <p id="at">Inicia sesión para ver tu correo</p>
  <input id="an" placeholder="Nombre" class="hide" autocomplete="name">
  <input id="ae" type="email" placeholder="Correo electrónico" required autocomplete="email">
  <input id="ap" type="password" placeholder="Contraseña (mínimo 6 caracteres)" required minlength="6" autocomplete="current-password">
  <div class="msg" id="am"></div>
  <button class="btn" id="ab">Iniciar sesión</button>
  <button type="button" class="link" id="as">¿No tienes cuenta? Crear una</button>
 </form>
</div>

<div id="app" class="hide">
 <header>
  <div class="logo"><svg width="30" height="30" viewBox="0 0 32 32"><rect x="2" y="6" width="28" height="20" rx="4" fill="currentColor"/><path d="M4 9l12 9 12-9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Mailito</b></div>
  <input id="q" type="search" placeholder="Buscar en el correo">
  <div class="who"><span id="me"></span><div class="av" id="av"></div><button id="out">Salir</button></div>
 </header>
 <div class="main">
  <nav id="nav">
   <button id="compose"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg><span>Redactar</span></button>
  </nav>
  <section>
   <div class="bar" id="bar"></div>
   <div id="setup" class="hide"></div>
   <div id="list"></div>
   <div id="read" class="hide"></div>
  </section>
 </div>
</div>

<div id="cm" class="hide">
 <h3>Mensaje nuevo<button id="cx" aria-label="Cerrar">×</button></h3>
 <input id="ct" type="email" placeholder="Para">
 <input id="cs" placeholder="Asunto">
 <textarea id="cb" placeholder="Escribe tu mensaje"></textarea>
 <div class="ft"><button class="btn" id="csend">Enviar</button><button id="cdraft">Guardar borrador</button><button id="cdel" style="margin-left:auto">Descartar</button></div>
</div>
<div id="toast" class="hide"></div>

<script>
const SUPABASE_URL="https://zvqdicdbbnmmimweaqjg.supabase.co";
const SUPABASE_KEY="sb_publishable_20JGNXAzPdlGiI75MCgnzw_pPYkSnmk";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const FOLDERS=[["inbox","Recibidos","M4 4h16v12h-4l-2 3h-4l-2-3H4z"],["starred","Destacados","M12 3l2.8 6 6.2.7-4.6 4.2 1.3 6.1L12 17l-5.7 3 1.3-6.1L3 9.7 9.2 9z"],["sent","Enviados","M3 11l18-8-8 18-2-8z"],["draft","Borradores","M5 3h10l4 4v14H5z"],["trash","Papelera","M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"]];
let showImg=false,user=null,profile=null,domain=null,folder="inbox",mails=[],cur=null,mode="in",draftId=null;

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const e=$("toast");e.textContent=t;e.classList.remove("hide");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.add("hide"),2800)}
function fdate(d){d=new Date(d);const n=new Date();return d.toDateString()===n.toDateString()?d.toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"}):d.toLocaleDateString("es",{day:"numeric",month:"short",year:d.getFullYear()===n.getFullYear()?undefined:"numeric"})}

/* ---- auth ---- */
function setMode(m){mode=m;const up=m==="up";$("an").classList.toggle("hide",!up);$("ab").textContent=up?"Crear cuenta":"Iniciar sesión";$("as").textContent=up?"¿Ya tienes cuenta? Inicia sesión":"¿No tienes cuenta? Crear una";$("at").textContent=up?"Crea tu cuenta de Mailito":"Inicia sesión para ver tu correo";$("ap").autocomplete=up?"new-password":"current-password";$("am").textContent=""}
$("as").onclick=()=>setMode(mode==="up"?"in":"up");
$("af").onsubmit=async e=>{e.preventDefault();const m=$("am");m.className="msg";m.textContent="";$("ab").disabled=true;
 const email=$("ae").value.trim(),password=$("ap").value;let r;
 if(mode==="up"){r=await sb.auth.signUp({email,password,options:{data:{name:$("an").value.trim()}}});
  if(!r.error&&!r.data.session){m.className="msg ok";m.textContent="Cuenta creada. Revisa tu correo para confirmarla y luego inicia sesión.";$("ab").disabled=false;return}}
 else r=await sb.auth.signInWithPassword({email,password});
 $("ab").disabled=false;
 if(r.error){m.textContent=r.error.message==="Invalid login credentials"?"Correo o contraseña incorrectos.":r.error.message;return}
 start(r.data.session.user)};
$("out").onclick=async()=>{await sb.auth.signOut();location.reload()};

async function start(u){user=u;
 const {data}=await sb.from("profiles").select("*").eq("id",u.id).single();profile=data||{email:u.email,name:u.email};
 $("auth").classList.add("hide");$("app").classList.remove("hide");
 const {data:cfg}=await sb.from("app_config").select("value").eq("key","mail_domain").maybeSingle();domain=cfg?cfg.value:null;
 $("me").textContent=profile.custom_address||profile.email;showSetup();
$("av").textContent=(profile.name||profile.email)[0].toUpperCase();
 buildNav();go("inbox")}

function showSetup(){const b=$("setup");
 if(profile.custom_address){b.classList.add("hide");return}
 b.classList.remove("hide");
 if(!domain){b.innerHTML="Para tener tu correo personalizado, primero hay que configurar el dominio (consulta las instrucciones de configuración).";return}
 b.innerHTML=`<span>Crea tu correo personalizado:</span><input id="al" placeholder="tunombre" maxlength="31"><span class="at">@${esc(domain)}</span><button class="btn" id="alb">Crear mi dirección</button>`;
 $("alb").onclick=async()=>{const {data,error}=await sb.rpc("set_address",{p_alias:$("al").value});
  if(error){toast(error.message);return}profile.custom_address=data;$("me").textContent=data;showSetup();toast("Tu dirección es "+data)}}
/* ---- navegación ---- */
function buildNav(){const n=$("nav");n.querySelectorAll(".f").forEach(x=>x.remove());
 FOLDERS.forEach(([id,l,p])=>{const b=document.createElement("button");b.className="f";b.dataset.f=id;
  b.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="${p}"/></svg><span>${l}</span><b class="n" id="n-${id}"></b>`;
  b.onclick=()=>go(id);n.appendChild(b)})}
async function go(f){folder=f;cur=null;$("q").value="";document.querySelectorAll("nav .f").forEach(b=>b.classList.toggle("on",b.dataset.f===f));await load();render()}
async function load(){
 let q=sb.from("emails").select("*").eq("owner_id",user.id).order("created_at",{ascending:false}).limit(300);
 const {data,error}=await q;if(error){toast("Error al cargar: "+error.message);return}
 mails=data||[];counts()}
function inFolder(m){return folder==="starred"?m.is_starred&&m.folder!=="trash":m.folder===folder}
function counts(){const u=mails.filter(m=>m.folder==="inbox"&&!m.is_read).length,d=mails.filter(m=>m.folder==="draft").length;
 $("n-inbox").textContent=u||"";$("n-draft").textContent=d||"";document.title=(u?`(${u}) `:"")+"Mailito"}

/* ---- lista / lectura ---- */
function render(){const lst=$("list"),rd=$("read"),bar=$("bar"),term=$("q").value.trim().toLowerCase();
 if(cur){lst.classList.add("hide");rd.classList.remove("hide");return renderRead()}
 rd.classList.add("hide");lst.classList.remove("hide");
 const name=FOLDERS.find(f=>f[0]===folder)[1];
 bar.innerHTML=`<span class="t">${name}</span>`+(folder==="trash"?`<button id="empty">Vaciar papelera</button>`:"")+`<button id="rf">Actualizar</button>`;
 $("rf").onclick=async()=>{await load();render()};
 if($("empty"))$("empty").onclick=async()=>{if(!confirm("¿Eliminar definitivamente todo lo de la papelera?"))return;await sb.from("emails").delete().eq("owner_id",user.id).eq("folder","trash");await load();render()};
 let rows=mails.filter(inFolder);
 if(term)rows=rows.filter(m=>(m.subject+m.body+m.from_email+m.from_name+m.to_email).toLowerCase().includes(term));
 if(!rows.length){lst.innerHTML=`<div class="empty">${term?"No hay resultados para tu búsqueda.":"No hay mensajes en "+name.toLowerCase()+"."}</div>`;return}
 lst.innerHTML="";
 rows.forEach(m=>{const r=document.createElement("div");r.className="row"+(!m.is_read&&m.folder==="inbox"?" u":"");
  const who=m.folder==="sent"||m.folder==="draft"?"Para: "+(m.to_email||"(sin destinatario)"):(m.from_name||m.from_email);
  r.innerHTML=`<button class="s ${m.is_starred?"on":""}" aria-label="Destacar">${m.is_starred?"★":"☆"}</button><div class="fr">${esc(who)}</div><div class="sb">${esc(m.subject||"(sin asunto)")} <span>— ${esc(m.body.replace(/\s+/g," ").slice(0,90))}</span></div><div class="d">${fdate(m.created_at)}</div>`;
  r.querySelector(".s").onclick=async e=>{e.stopPropagation();await upd(m,{is_starred:!m.is_starred});render()};
  r.onclick=()=>open(m);lst.appendChild(r)})}
async function upd(m,patch){Object.assign(m,patch);const {error}=await sb.from("emails").update(patch).eq("id",m.id);if(error)toast("Error: "+error.message);counts()}
async function open(m){if(m.folder==="draft")return compose(m);cur=m;if(!m.is_read)await upd(m,{is_read:true});render()}
function renderRead(){const m=cur,bar=$("bar"),rd=$("read");
 bar.innerHTML=`<button id="bk">← Volver</button><span class="t"></span>`+(m.folder==="trash"?`<button id="rs">Restaurar</button><button id="dl">Eliminar definitivamente</button>`:`<button id="tr">Mover a la papelera</button><button id="mu">Marcar como no leído</button>`)+`<button id="st">${m.is_starred?"★ Quitar estrella":"☆ Destacar"}</button>`;
 $("bk").onclick=()=>{cur=null;render()};
 if($("tr"))$("tr").onclick=async()=>{await upd(m,{folder:"trash"});toast("Conversación movida a la papelera");cur=null;render()};
 if($("mu"))$("mu").onclick=async()=>{await upd(m,{is_read:false});cur=null;render()};
 if($("rs"))$("rs").onclick=async()=>{await upd(m,{folder:m.from_email===profile.email?"sent":"inbox"});cur=null;render()};
 if($("dl"))$("dl").onclick=async()=>{await sb.from("emails").delete().eq("id",m.id);mails=mails.filter(x=>x.id!==m.id);cur=null;counts();render()};
 $("st").onclick=async()=>{await upd(m,{is_starred:!m.is_starred});renderRead()};
 rd.innerHTML=`<h2>${esc(m.subject||"(sin asunto)")}</h2><div class="meta"><div class="av">${esc((m.from_name||m.from_email)[0].toUpperCase())}</div><div><b>${esc(m.from_name||m.from_email)}</b> &lt;${esc(m.from_email)}&gt;<small>para ${esc(m.to_email)} · ${new Date(m.created_at).toLocaleString("es")}</small></div></div>${m.html?`<div class="img">${showImg?"Imágenes remotas visibles.":"Se bloquearon las imágenes remotas por privacidad."} <button id="im" class="link" style="display:inline;width:auto;margin:0">${showImg?"Ocultar":"Mostrar imágenes"}</button></div><iframe id="fr" sandbox="allow-popups" referrerpolicy="no-referrer" title="Mensaje"></iframe>`:`<pre>${esc(m.body)}</pre>`}<p style="margin-top:28px">${m.folder==="inbox"?'<button class="btn" id="rp">Responder</button>':""}</p>`;
if(m.html){const csp=`default-src 'none'; style-src 'unsafe-inline'; img-src data:${showImg?" https:":""}`;
  $("fr").srcdoc=`<!doctype html><meta http-equiv="Content-Security-Policy" content="${csp}"><base target="_blank"><style>body{font:14px/1.5 system-ui,sans-serif;color:#1f2933;margin:12px;word-wrap:break-word}img{max-width:100%;height:auto}</style>${m.html}`;
  $("im").onclick=()=>{showImg=!showImg;renderRead()}}
 if($("rp"))$("rp").onclick=()=>compose(null,{to:m.from_email,subject:/^re:/i.test(m.subject)?m.subject:"Re: "+m.subject,body:"\n\n— El "+new Date(m.created_at).toLocaleString("es")+", "+m.from_email+" escribió:\n"+m.body.split("\n").map(l=>"> "+l).join("\n")})}
$("q").oninput=()=>{cur=null;render()};

/* ---- redactar ---- */
function compose(d,pre){draftId=d?d.id:null;const p=d?{to:d.to_email,subject:d.subject,body:d.body}:(pre||{});
 $("ct").value=p.to||"";$("cs").value=p.subject||"";$("cb").value=p.body||"";$("cm").classList.remove("hide");(p.to?$("cb"):$("ct")).focus();if(p.to)$("cb").setSelectionRange(0,0)}
$("compose").onclick=()=>compose();
function closeC(){$("cm").classList.add("hide");draftId=null}
$("cx").onclick=async()=>{if($("ct").value||$("cs").value||$("cb").value)await saveDraft(true);closeC()};
async function saveDraft(quiet){const row={to_email:$("ct").value.trim(),subject:$("cs").value,body:$("cb").value};let r;
 if(draftId)r=await sb.from("emails").update(row).eq("id",draftId).select().single();
 else r=await sb.from("emails").insert({...row,owner_id:user.id,folder:"draft",from_email:profile.email,from_name:profile.name,is_read:true}).select().single();
 if(r.error){toast("Error: "+r.error.message);return false}draftId=r.data.id;if(!quiet)toast("Borrador guardado");await load();if(!cur)render();return true}
$("cdraft").onclick=async()=>{if(await saveDraft(false))closeC()};
$("cdel").onclick=async()=>{if(draftId){await sb.from("emails").delete().eq("id",draftId);await load();render()}closeC()};
$("csend").onclick=async()=>{const to=$("ct").value.trim();if(!/^\S+@\S+\.\S+$/.test(to)){toast("Escribe un destinatario válido");return}
 $("csend").disabled=true;
 let error;
 if(profile.custom_address){const r=await sb.functions.invoke("send-external",{body:{to,subject:$("cs").value,body:$("cb").value}});error=r.error||(r.data&&r.data.error?{message:r.data.error}:null);
  if(r.error&&r.error.context&&r.error.context.json){try{const j=await r.error.context.json();error={message:j.error||r.error.message}}catch(_){}}}
 else error=(await sb.rpc("send_email",{p_to:to,p_subject:$("cs").value,p_body:$("cb").value})).error;
 $("csend").disabled=false;
 if(error){toast("No se pudo enviar: "+error.message);return}
 if(draftId)await sb.from("emails").delete().eq("id",draftId);
 closeC();toast("Mensaje enviado");await load();cur=null;render()};

/* ---- inicio ---- */
sb.auth.getSession().then(({data})=>{if(data.session)start(data.session.user)});
setInterval(async()=>{if(user&&!cur&&$("cm").classList.contains("hide")){await load();render()}},30000);
</script>
</body>
</html>
